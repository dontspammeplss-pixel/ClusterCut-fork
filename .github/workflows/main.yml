# .github/workflows/build.yml
name: Build both

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + target
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target == 'linux' && 'x86_64-unknown-linux-gnu' || 'x86_64-pc-windows-gnu' }}
      - if: matrix.target == 'windows'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64-x86_64-toolchain
      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release ${{ matrix.target == 'windows' && '--target x86_64-pc-windows-gnu' || '' }}
