name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux, windows]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + target
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target == 'linux' && 'x86_64-unknown-linux-gnu' || 'x86_64-pc-windows-gnu' }}
      - if: matrix.target == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64
      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "windows" ]; then
            cargo build --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-gnu
          else
            cargo build --release --manifest-path src-tauri/Cargo.toml
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clustercut-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target == 'windows' && 'x86_64-pc-windows-gnu' || 'x86_64-unknown-linux-gnu' }}/release/**
